<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>HTML DOM</h2>
    <p>Fc Barcelona</p>
    <p>Real Madrid</p>
    <p>Atletico Madrid</p>
    <p id="demo"></p>

    <h6>Messi</h6>
    <h6>Ronaldo</h6>
    <h6>Neymar</h6>
    <h6>Neymar</h6>

    <button onclick="myFunction()">Color</button>
    <button onclick="myFunction2()">color2</button>

    <script>
        const myCollection=document.getElementsByTagName("p");

        document.getElementById("demo").innerHTML+="the inner html is: "+myCollection[2].innerHTML+"<br>";
        const myNodeList=document.querySelectorAll("p");
        function myFunction(){
            const myColorCollection=document.getElementsByTagName("h6");
            
            for(let i=0;
                i<myColorCollection.length;
                i++ )
                {myColorCollection[i].style.color="red"}
        }

        function myFunction2(){
            for(
                let i=0;
                i<myCollection.length;
                i++
            )
            {myCollection[i].style.color="blue"}
        }
        
        document.getElementById("demo").innerHTML=myNodeList.length+" "+myCollection.length;

    </script>
</body>
</html>
